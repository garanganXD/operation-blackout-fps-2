<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OPERATION BLACKOUT</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0d12;font-family:'Courier New',monospace}
  canvas{display:block}
  #hud{position:fixed;inset:0;pointer-events:none;color:#e8e6e3;text-shadow:0 0 4px #000}
  #crosshair{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%)}
  #bottom{position:fixed;left:20px;bottom:16px;font-size:20px}
  #ammo{position:fixed;right:24px;bottom:16px;font-size:34px;font-weight:bold}
  #timer{position:fixed;top:12px;left:50%;transform:translateX(-50%);font-size:26px}
  #score{position:fixed;top:44px;left:50%;transform:translateX(-50%);font-size:18px}
  #round{position:fixed;top:12px;left:20px;font-size:20px}
  #buy{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(10,13,18,.92);
       border:1px solid #3a8f4a;padding:24px 32px;font-size:17px;line-height:2;pointer-events:auto;display:none}
  #buy h2{margin:0 0 8px;color:#7fd88f;font-size:22px}
  #buy .row{cursor:pointer}
  #buy .row:hover{color:#7fd88f}
  #msg{position:fixed;top:35%;left:50%;transform:translateX(-50%);font-size:30px;font-weight:bold;color:#d8b24a}
  #money{position:fixed;right:24px;bottom:60px;font-size:20px;color:#8fce6f}
</style>
<script type="importmap">
{"imports":{"three":"./vendor/three.module.min.js"}}
</script>
</head>
<body>
<div id="hud">
  <svg id="crosshair" width="40" height="40">
    <line x1="20" y1="8" x2="20" y2="15" stroke="#cfe8d0" stroke-width="2"/>
    <line x1="20" y1="25" x2="20" y2="32" stroke="#cfe8d0" stroke-width="2"/>
    <line x1="8" y1="20" x2="15" y2="20" stroke="#cfe8d0" stroke-width="2"/>
    <line x1="25" y1="20" x2="32" y2="20" stroke="#cfe8d0" stroke-width="2"/>
  </svg>
  <div id="round">ROUND 1</div>
  <div id="timer">1:55</div>
  <div id="score">VIPERS 0 — 0 SERPENTS</div>
  <div id="bottom">HP 100</div>
  <div id="money">$ 800</div>
  <div id="ammo">30 / 90</div>
  <div id="msg"></div>
  <div id="buy">
    <h2>BUY MENU — press number to purchase</h2>
    <div class="row" data-i="1">[1] RAPTOR — rifle ......... $2700</div>
    <div class="row" data-i="2">[2] HORNET — smg ........... $1200</div>
    <div class="row" data-i="3">[3] LONGSHADOW — sniper .... $4750</div>
    <div class="row" data-i="4">[4] KEVLAR VEST ............ $ 650</div>
    <div style="margin-top:10px;color:#8a929c">[B] close &nbsp; [R] reload</div>
  </div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
